[project]
name = "coralcon"
version = "0.1.0"
description = "AI-powered career agent analyzing job-search data across sources via Coral SQL."
requires-python = ">=3.11"
dependencies = [
    "anthropic>=0.40.0",
    "click>=8.1.7",
    "rich>=13.7.0",
    "fastapi>=0.115.0",
    "uvicorn>=0.32.0",
    "jinja2>=3.1.4",
    "python-dotenv>=1.0.1",
    "pydantic>=2.9.0",
    "httpx>=0.28.0",
    "notion-client>=2.0.0",
]

[project.optional-dependencies]
dev = ["pytest>=8.0.0"]

[tool.uv]
package = false

[tool.vercel]
entrypoint = "web.app:app"
